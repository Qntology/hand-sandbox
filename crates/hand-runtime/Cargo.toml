[package]
name = "hand-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs the simulated robot: recognise, gate with SDS and time series, carry out quests, log everything. No UI dependency."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
base64 = "0.22"
candle-core = { workspace = true }
hand-core = { path = "../hand-core" }
hand-ml = { path = "../hand-ml" }
hand-search = { path = "../hand-search" }
hand-quest = { path = "../hand-quest" }
hand-sds = { path = "../hand-sds" }
hand-ts = { path = "../hand-ts" }
hand-vision = { path = "../hand-vision" }
world-sim = { path = "../world-sim" }

[dev-dependencies]
candle-nn = { workspace = true }
# The development server mirrors the test records into LanceDB like the app does.
hand-data = { path = "../hand-data" }
tokio = { workspace = true }

[features]
default = []
# GPU backends of every model the runtime loads (SigLIP2, TIPS, SAM, Granite TTM).
cuda = ["hand-vision/cuda", "hand-ml/cuda"]
metal = ["hand-vision/metal", "hand-ml/metal"]
vulkan = ["hand-vision/vulkan", "hand-ml/vulkan"]
rocm = ["hand-vision/rocm", "hand-ml/rocm"]
