[package]
name = "hand-ts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Time-series forecasting for score histories: Granite TTM-R3 on candle, damped Holt fallback, holdout backtest fusion, and a temporal consistency gate"

[features]
default = ["granite"]
# Granite TTM-R3 forecaster (needs candle). Without it only the statistical predictors are built.
granite = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
