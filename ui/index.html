<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>물류 로봇 손 시뮬레이터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>물류 로봇 손 시뮬레이터</h1>
      <p class="sub">손가락 수 · 관절 옵션 · 발(이동 베이스) · SigLIP2 분류 · Lance 합성 데이터</p>
    </div>
    <div class="top-right">
      <select id="device-select" aria-label="연산 장치"></select>
      <div class="chip" id="device-chip">장치 확인 중…</div>
    </div>
  </header>

  <main class="layout">
    <!-- 왼쪽: 손 구성 -->
    <section class="panel" aria-labelledby="hand-h">
      <h2 id="hand-h">손 구성</h2>

      <fieldset>
        <legend>손가락 수 (프리셋)</legend>
        <div class="seg" id="finger-count"></div>
        <p class="hint" id="finger-desc"></p>
      </fieldset>

      <label>관절 개수 (손가락당)
        <select id="segments">
          <option value="2">2 관절</option>
          <option value="3">3 관절</option>
          <option value="4">4 관절</option>
        </select>
      </label>
      <label>근위(뿌리) 관절
        <select id="base-kind"></select>
      </label>
      <label>원위 관절
        <select id="distal-kind"></select>
      </label>
      <label>구동 방식
        <select id="actuation">
          <option value="direct">직접 구동 (관절마다 액추에이터)</option>
          <option value="coupled">결합 구동 (힘줄 방식)</option>
        </select>
      </label>
      <label id="ratio-row">결합 비율 <output id="ratio-out">0.67</output>
        <input type="range" id="ratio" min="0.3" max="1" step="0.01" value="0.67" />
      </label>

      <fieldset>
        <legend>발 (이동 베이스)</legend>
        <div class="stack" id="base-choices"></div>
      </fieldset>
    </section>

    <!-- 가운데: 손 그림과 파지 -->
    <section class="panel stage" aria-labelledby="stage-h">
      <div class="stage-head">
        <h2 id="stage-h">측면도</h2>
        <label class="inline">
          <input type="checkbox" id="show-grasp" /> 물체 파지 시뮬레이션
        </label>
      </div>
      <canvas id="hand-canvas" width="860" height="520" aria-label="손 측면도"></canvas>
      <label>손가락 닫힘 <output id="closure-out">0.00</output>
        <input type="range" id="closure" min="0" max="1" step="0.01" value="0" />
      </label>
      <p class="hint" id="geom-note"></p>
    </section>

    <!-- 오른쪽: 물체, 결과, 데이터 -->
    <section class="panel" aria-labelledby="obj-h">
      <h2 id="obj-h">물체</h2>
      <label>물류 대상 (사전)
        <select id="label"></select>
      </label>
      <div class="grid2">
        <label>질량 (kg) <output id="mass-out">1.00</output>
          <input type="range" id="mass" min="0.1" max="5" step="0.05" value="1" />
        </label>
        <label>마찰 계수 <output id="friction-out">0.50</output>
          <input type="range" id="friction" min="0.2" max="1" step="0.01" value="0.5" />
        </label>
        <label>배치 z 오프셋 (m) <output id="zoff-out">0.000</output>
          <input type="range" id="zoff" min="-0.02" max="0.02" step="0.001" value="0" />
        </label>
      </div>
      <p class="hint" id="size-note"></p>

      <h3>파지 결과</h3>
      <dl class="results" id="grasp-results"></dl>

      <h3>발별 주행 비교</h3>
      <p class="hint">기본 경로: 평지 10m → 5° 완만한 경사 → 5cm 턱 → 20° 경사 → 15cm 계단 → 평지 5m</p>
      <table class="drive" id="drive-table"></table>

      <h3>비전 분류 (SigLIP2)</h3>
      <input type="file" id="image-file" accept="image/*" />
      <div id="preview-wrap" hidden><img id="preview" alt="입력 이미지 미리보기" /></div>
      <ol class="scores" id="scores"></ol>
      <button id="use-top" type="button" disabled>최상위 라벨을 물체로 설정</button>

      <h3>합성 데이터 (Lance)</h3>
      <div class="grid2">
        <label>에피소드 수
          <input type="number" id="count" min="1" max="5000" value="200" />
        </label>
        <label>시드
          <input type="number" id="seed" min="0" value="1" />
        </label>
      </div>
      <div class="row">
        <button id="load-dict" type="button">사전 적재</button>
        <button id="synth" type="button" class="primary">합성 데이터 생성</button>
      </div>
      <table class="drive" id="table-status"></table>
      <p class="hint" id="store-note"></p>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status" role="status">준비됨</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
