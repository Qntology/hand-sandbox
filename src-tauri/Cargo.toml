[package]
name = "noto-sim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Noto logistics robot simulator: presets, grasp and drive tests, SigLIP2 classification, Lance dataset"

[lib]
name = "noto_sim_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
noto-core = { path = "../crates/noto-core" }
noto-ml = { path = "../crates/noto-ml" }
noto-data = { path = "../crates/noto-data" }
noto-runtime = { path = "../crates/noto-runtime" }
noto-vision = { path = "../crates/noto-vision" }
candle-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
base64 = "0.22"
tokio = { workspace = true }
# Model downloads from Hugging Face (rustls, as object_store already builds it) and their check.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"

[features]
default = []
# GPU backends. Each one switches on the matching candle backend in noto-ml.
cuda = ["noto-ml/cuda", "noto-runtime/cuda"]
metal = ["noto-ml/metal", "noto-runtime/metal"]
vulkan = ["noto-ml/vulkan", "noto-runtime/vulkan"]
rocm = ["noto-ml/rocm", "noto-runtime/rocm"]
