[package]
name = "hand-sim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logistics robot hand simulator: presets, grasp and drive tests, SigLIP2 classification, Lance dataset"

[lib]
name = "hand_sim_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hand-core = { path = "../crates/hand-core" }
hand-ml = { path = "../crates/hand-ml" }
hand-data = { path = "../crates/hand-data" }
hand-runtime = { path = "../crates/hand-runtime" }
hand-vision = { path = "../crates/hand-vision" }
candle-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
base64 = "0.22"
tokio = { workspace = true }

[features]
default = []
# GPU backends. Each one switches on the matching candle backend in hand-ml.
cuda = ["hand-ml/cuda", "hand-runtime/cuda"]
metal = ["hand-ml/metal", "hand-runtime/metal"]
vulkan = ["hand-ml/vulkan", "hand-runtime/vulkan"]
rocm = ["hand-ml/rocm", "hand-runtime/rocm"]
