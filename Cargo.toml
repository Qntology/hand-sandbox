[workspace]
resolver = "2"
members = [
    "crates/noto-core",
    "crates/noto-ml",
    "crates/noto-data",
    "crates/world-sim",
    "crates/noto-sds",
    "crates/noto-ts",
    "crates/noto-search",
    "crates/noto-quest",
    "crates/noto-vision",
    "crates/noto-runtime",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokenizers = "0.22"
lancedb = { version = "0.31.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
rayon = "1"
webp = "0.3"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"

[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "2191c7ad898d866c4db5380ea1fc13a98f435e0c" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "2191c7ad898d866c4db5380ea1fc13a98f435e0c" }

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 3

[profile.dev.package.world-sim]
opt-level = 3

[profile.dev.package.noto-vision]
opt-level = 3

[profile.dev.package.noto-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
